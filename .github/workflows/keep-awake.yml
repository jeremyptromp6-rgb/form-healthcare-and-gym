# Keeps the free Render server awake: it sleeps after ~15 minutes without a request, so this pings
# /health every ~10 minutes.
# - Scheduled workflows run only from the default branch (main), so this does nothing until it is merged.
# - GitHub pauses scheduled workflows after 60 days without repository activity; re-enable it in the
#   Actions tab (or push any commit).
# - An always-awake service uses ~744 of Render's 750 free instance hours a month, so only this one
#   service can stay awake on the free plan.
# - Schedules can run a few minutes late; the minutes below avoid the busy top of the hour.
name: Keep API awake

on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      API: ${{ vars.EXPO_PUBLIC_API_URL || 'https://form-api-e68m.onrender.com' }}
    steps:
      # A sleeping server needs about a minute to wake, hence the long timeout and a retry.
      - run: curl -fsS --max-time 90 --retry 2 --retry-delay 5 "${API%/}/health" -o /dev/null
