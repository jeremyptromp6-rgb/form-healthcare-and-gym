name: CI

on:
  push:
    branches: [main, 'preview/**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
      - run: npm ci
      - run: npm ci --prefix apps/mobile
      # typecheck → lint → unit/integration tests → API bundle + web export → production smoke test
      - run: npm run validate
        env:
          CI: "1"
