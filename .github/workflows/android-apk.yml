name: Android APK

# Builds an installable Android APK of the FORM app and publishes it as the
# "android-latest" GitHub Release (a direct download) plus a run artifact.
# No Expo account needed: the native project is generated here with `expo prebuild`
# and compiled with Gradle. The android/ folder is never committed.
#
# Order: this runs only after the "CI" workflow has succeeded on a push to main (workflow_run), so a
# red commit never publishes an APK, and the slow build is not a check that runs alongside CI on the
# push commit. The API deploy on Render (autoDeployTrigger: checksPass in render.yaml) can therefore
# follow CI alone. (Assumption: Render considers the checks that exist on the commit when CI ends;
# this workflow only starts after that.) Run it by hand with workflow_dispatch to build any time.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-apk
  cancel-in-progress: true

# Read-only by default; only the publish job below gets write access.
permissions:
  contents: read

jobs:
  apk:
    # workflow_run also fires for pull requests whose branch happens to be called "main" (including
    # from forks): only a push to main, after green CI, may build.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # The commit CI just validated (workflow_run), or the commit a manual run was started on.
      BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      # The hosted FORM API (Render). A repository variable EXPO_PUBLIC_API_URL overrides it.
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://form-api-e68m.onrender.com' }}
      # This APK is a test build: it serves Google's official *test* ads (labelled "Test Ad"), never
      # production ads. A store build sets EXPO_PUBLIC_ADS_MODE=production plus the AdMob ids as
      # secrets (ADMOB_ANDROID_APP_ID, EXPO_PUBLIC_ADMOB_INTERSTITIAL_ANDROID).
      EXPO_PUBLIC_ADS_MODE: ${{ vars.EXPO_PUBLIC_ADS_MODE || 'test' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      # The runner image ships the Android SDK. Check it is there, and accept its licences up front so
      # Gradle never stops to ask for one it needs to download.
      - name: Check the Android SDK and accept its licences
        run: |
          if [ -z "$ANDROID_HOME" ] || [ ! -d "$ANDROID_HOME" ]; then
            echo "::error title=Android SDK::ANDROID_HOME is not set or does not exist on this runner image"
            exit 1
          fi
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
          else
            echo "::warning title=Android SDK::sdkmanager not found at $SDKMANAGER; relying on the image's pre-accepted licences"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix apps/mobile

      # Android refuses to install an APK whose versionCode is not higher than the installed one, so
      # every build needs a larger one. app.json is edited in this runner's workspace only (never
      # committed); expo prebuild reads it from there.
      - name: Set the Android versionCode from the run number
        working-directory: apps/mobile
        run: |
          node -e 'const fs=require("fs");const j=JSON.parse(fs.readFileSync("app.json","utf8"));j.expo.android.versionCode=Number(process.env.GITHUB_RUN_NUMBER);fs.writeFileSync("app.json",JSON.stringify(j,null,2)+"\n");console.log("android.versionCode =",j.expo.android.versionCode)'

      - name: Generate the native Android project
        working-directory: apps/mobile
        run: |
          npx expo prebuild --platform android --no-install
          # The ad SDK makes the app big enough that R8/D8's dex merge can run out of the template's
          # 2 GB Gradle heap on the runner. Give Gradle more room (the runner has 16 GB).
          sed -i '/^org.gradle.jvmargs=/d' android/gradle.properties
          # The generated file has no trailing newline: start on a fresh line, or the setting would be
          # glued onto Expo's last property and corrupt it.
          printf '\norg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8\n' >> android/gradle.properties
          tail -3 android/gradle.properties
          grep jvmargs android/gradle.properties

      - name: Build the release APK
        working-directory: apps/mobile/android
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a,armeabi-v7a 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      # Job logs need a GitHub sign-in to read; annotations are public. On failure, surface Gradle's
      # own explanation (the "What went wrong" block and the error lines) as annotations, so a build
      # problem can be diagnosed from the run summary alone. Nothing secret is in a Gradle error.
      - name: Report why the build failed
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/gradle.log"
          [ -f "$LOG" ] || exit 0
          report() { body=$(cat); body="${body//'%'/'%25'}"; body="${body//$'\n'/'%0A'}"; echo "::error title=$1::${body:0:4000}"; }
          grep -A 25 "What went wrong" "$LOG" | head -80 | report "Gradle: what went wrong"
          grep -E "^e: |error:|FAILURE:|Execution failed|Could not resolve|> Task .* FAILED|OutOfMemory|Java heap space|GC overhead|defined multiple times|Duplicate class|Caused by" "$LOG" | head -40 | report "Gradle: error lines"
          # The 60 lines before the failure, without the ads library's banner noise: shows a failing
          # tool's own output (e.g. a node script's error).
          grep -n "FAILURE: Build" "$LOG" | head -1 | cut -d: -f1 | { read -r n; [ -n "$n" ] && head -n "$n" "$LOG" | grep -vE '^\*+$|^$|react-native-google-mobile-ads' | tail -60; } | report "Gradle: before the failure"
          grep -E "^Caused by|Exception:|at org.gradle.process|node" "$LOG" | grep -vE '^[[:space:]]*at java' | head -30 | report "Gradle: causes"

      - name: Check the APK is signed (installable)
        run: |
          APK=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"
          VERSION=$(node -p "require('./apps/mobile/app.json').expo.version")
          mkdir -p out
          cp "$APK" "out/FORM-${VERSION}-${BUILD_SHA::7}.apk"
          ls -la out

      - uses: actions/upload-artifact@v6
        with:
          name: FORM-android-apk
          path: out/*.apk

  # Publishing is a separate job so that only this one holds a write token; the build job above runs
  # the repository's install scripts and Gradle with read-only access.
  publish:
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: FORM-android-apk
          path: out

      # Atomic update: the release is created only if missing and the new APK is uploaded (replacing
      # a same-named one) BEFORE the older APKs are removed, so the download link never 404s.
      - name: Publish as the "android-latest" release
        run: |
          set -eu
          APK=$(ls out/FORM-*.apk | head -1)
          NAME=$(basename "$APK")
          TITLE="FORM for Android — latest build"
          NOTES="Built from ${BUILD_SHA::7}. On your Android phone: download the .apk below, open it, and allow installing from your browser if asked. This is a test build signed with a development key, not a Play Store release."

          gh release view android-latest >/dev/null 2>&1 || \
            gh release create android-latest --target "$BUILD_SHA" --prerelease --title "$TITLE" --notes "$NOTES"

          gh release upload android-latest "$APK" --clobber
          gh release edit android-latest --prerelease --title "$TITLE" --notes "$NOTES"

          # Point the tag at the built commit (best effort; the release and its assets are already updated).
          gh api -X PATCH "repos/$GH_REPO/git/refs/tags/android-latest" -f sha="$BUILD_SHA" -F force=true >/dev/null \
            || echo "::warning::could not move the android-latest tag to ${BUILD_SHA::7}"

          # Only now remove the older FORM-*.apk assets.
          gh release view android-latest --json assets --jq '.assets[].name' | while read -r asset; do
            case "$asset" in
              FORM-*.apk) [ "$asset" = "$NAME" ] || gh release delete-asset android-latest "$asset" --yes </dev/null ;;
            esac
          done
          gh release view android-latest --json assets --jq '.assets[] | "\(.name) \(.size)"'
