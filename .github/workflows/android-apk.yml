name: Android APK

# Builds an installable Android APK of the FORM app and publishes it as the
# "android-latest" GitHub Release (a direct download) plus a run artifact.
# No Expo account needed: the native project is generated here with `expo prebuild`
# and compiled with Gradle. The android/ folder is never committed.

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/domain/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

concurrency:
  group: android-apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The hosted FORM API (Render). A repository variable EXPO_PUBLIC_API_URL overrides it.
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://form-api-e68m.onrender.com' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix apps/mobile

      - name: Generate the native Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Build the release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Check the APK is signed (installable)
        run: |
          APK=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"
          VERSION=$(node -p "require('./apps/mobile/app.json').expo.version")
          mkdir -p out
          cp "$APK" "out/FORM-${VERSION}-${GITHUB_SHA::7}.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: FORM-android-apk
          path: out/*.apk

      - name: Publish as the "android-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest out/*.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "FORM for Android — latest build" \
            --notes "Built from ${GITHUB_SHA::7}. On your Android phone: download the .apk below, open it, and allow installing from your browser if asked. This is a test build signed with a development key, not a Play Store release."
