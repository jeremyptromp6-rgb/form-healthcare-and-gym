# Render Blueprint for FORM's API (https://render.com/docs/blueprint-spec).
# In Render: New → Blueprint → pick this repository. Render reads this file, creates the service
# and generates a JWT secret.
#
# FREE PLAN WITH BACKUPS: free services have no disk, so the database is continuously copied to a
# private Cloudflare R2 bucket by Litestream and restored from it on every start. Data therefore
# survives sleeps, restarts and deploys; at most about one second of the latest writes can be lost
# in a crash. Backups are kept for 7 days. Set it up once (docs/RELEASE.md → Backups): paste the four
# R2 values below into the Render dashboard → Environment. Until all four are set the server
# refuses to start with a half-configured backup, and with none set it runs WITHOUT backups
# (/status then shows backup: "off"; data is wiped on restart).
# The free server also sleeps after ~15 minutes without requests; .github/workflows/keep-awake.yml
# pings it to prevent that.
# Deploys overlap the old and new instance for about a minute (docs/RELEASE.md, Backups): deploy at quiet
# times. A Render Starter service with a disk has no overlap.
#
# To use a Render disk instead (Starter): change `plan` to 0.5c-512mb, uncomment the `disk` block, and
# set DATABASE_PATH to /var/data/form.db. Render then shows the monthly price before applying.
services:
  - type: web
    name: form-api
    runtime: node
    plan: free
    region: oregon
    # devDependencies (esbuild, TypeScript) are needed to build, even with NODE_ENV=production.
    buildCommand: npm ci --include=dev && npm run build -w @form/api && sh apps/api/scripts/install-litestream.sh
    # Restores the database from R2, then runs the server under Litestream (apps/api/scripts/start.mjs).
    startCommand: node apps/api/scripts/start.mjs
    healthCheckPath: /health
    # Render stops the old instance with SIGTERM ~60 s after the new one is live; Litestream then does a final
    # sync (up to 30 s), which the default 30 s shutdown delay could cut short. Both instances exist during
    # that minute (no switch avoids it on the free plan); see docs/RELEASE.md, Backups.
    maxShutdownDelaySeconds: 60
    # Deploy a new commit only after GitHub's CI checks pass. The Android APK workflow starts only
    # after CI succeeds (workflow_run), so the slow APK build doesn't hold the API deploy back.
    autoDeployTrigger: checksPass
    # disk:
    #   name: form-data
    #   mountPath: /var/data
    #   sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      # Signs session tokens: a random 256-bit value Render generates once and keeps.
      - key: JWT_SECRET
        generateValue: true
      # Free plan: the service's own (temporary) filesystem, restored from R2 on start. Starter: /var/data/form.db on the disk.
      - key: DATABASE_PATH
        value: ./form.db
      # Backups: Cloudflare R2 (private bucket) via Litestream. Values are pasted in the Render dashboard,
      # never committed. The token must be scoped to that one bucket (Object Read & Write).
      - key: R2_ACCOUNT_ID
        sync: false
      - key: LITESTREAM_BUCKET
        sync: false
      - key: LITESTREAM_ACCESS_KEY_ID
        sync: false
      - key: LITESTREAM_SECRET_ACCESS_KEY
        sync: false
      # The phone app doesn't use CORS; production still requires an explicit origin list.
      - key: CORS_ORIGINS
        value: https://form-api-e68m.onrender.com
      # Rule-based coaching (no AI provider key needed).
      - key: COACH_PROVIDER
        value: rules
      # Meal photo scanning with Google Gemini's free tier. Add GEMINI_API_KEY (from Google AI
      # Studio) in the Render dashboard → Environment; until then scanning reports unavailable.
      - key: FOOD_RECOGNITION_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      # PRODUCTION: the server is live (not in testing) and no store is connected yet, so FORM Pro is
      # "coming soon" and nobody can get it for free. Both values are explicit on purpose: Render keeps
      # an old dashboard value for a key that is removed from this file, and the server refuses
      # BILLING_PROVIDER=development outside APP_STAGE=testing. To sell Pro later, replace "none" with
      # a real store provider here; never set the development store on this server.
      - key: APP_STAGE
        value: live
      - key: BILLING_PROVIDER
        value: none
