# Render Blueprint for FORM's API (https://render.com/docs/blueprint-spec).
# In Render: New → Blueprint → pick this repository. Render reads this file, creates the service
# and generates a JWT secret.
#
# TESTING SETUP (free plan): the server sleeps after ~15 minutes without requests (the next
# request wakes it in about a minute), and free services have no disk — every account, workout
# and food log is wiped whenever it restarts or redeploys. Fine for trying FORM out; not for
# real use.
#
# To keep data (Starter): change `plan` to 0.5c-512mb, uncomment the `disk` block, and set
# DATABASE_PATH to /var/data/form.db. Render then shows the monthly price before applying.
services:
  - type: web
    name: form-api
    runtime: node
    plan: free
    region: oregon
    # devDependencies (esbuild, TypeScript) are needed to build, even with NODE_ENV=production.
    buildCommand: npm ci --include=dev && npm run build -w @form/api
    startCommand: npm start -w @form/api
    healthCheckPath: /health
    # Deploy a new commit only after GitHub's CI checks pass.
    autoDeployTrigger: checksPass
    # disk:
    #   name: form-data
    #   mountPath: /var/data
    #   sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      # Signs session tokens: a random 256-bit value Render generates once and keeps.
      - key: JWT_SECRET
        generateValue: true
      # Free plan: the service's own (temporary) filesystem. Starter: /var/data/form.db on the disk.
      - key: DATABASE_PATH
        value: ./form.db
      # The phone app doesn't use CORS; production still requires an explicit origin list.
      - key: CORS_ORIGINS
        value: https://form-api-e68m.onrender.com
      # Rule-based coaching (no AI provider key needed). Food photo scanning stays off until a
      # provider key is added; Pro purchases stay off until a real store is connected.
      - key: COACH_PROVIDER
        value: rules
      - key: FOOD_RECOGNITION_PROVIDER
        value: none
      - key: BILLING_PROVIDER
        value: none
