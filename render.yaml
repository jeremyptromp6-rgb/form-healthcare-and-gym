# Render Blueprint for FORM's API (https://render.com/docs/blueprint-spec).
# In Render: New → Blueprint → pick this repository. Render reads this file and creates the
# service, generates a JWT secret, and attaches a disk so accounts and logs survive restarts.
services:
  - type: web
    name: form-api
    runtime: node
    # The smallest paid instance: always on, and paid plans can have a persistent disk.
    plan: 0.5c-512mb
    region: oregon
    # devDependencies (esbuild, TypeScript) are needed to build, even with NODE_ENV=production.
    buildCommand: npm ci --include=dev && npm run build -w @form/api
    startCommand: npm start -w @form/api
    healthCheckPath: /health
    # Deploy a new commit only after GitHub's CI checks pass.
    autoDeployTrigger: checksPass
    disk:
      name: form-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      # Signs session tokens: a random 256-bit value Render generates once and keeps.
      - key: JWT_SECRET
        generateValue: true
      # On the persistent disk, so data is kept across restarts and deploys.
      - key: DATABASE_PATH
        value: /var/data/form.db
      # The phone app doesn't use CORS; production still requires an explicit origin list.
      - key: CORS_ORIGINS
        value: https://form-api.onrender.com
      # Rule-based coaching (no AI provider key needed). Food photo scanning stays off until a
      # provider key is added; Pro purchases stay off until a real store is connected.
      - key: COACH_PROVIDER
        value: rules
      - key: FOOD_RECOGNITION_PROVIDER
        value: none
      - key: BILLING_PROVIDER
        value: none
